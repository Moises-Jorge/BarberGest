version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: barbergest
    restart: on-failure
    environment:
      POSTGRES_USER: admin_barber
      POSTGRES_PASSWORD: barbergest123
      POSTGRES_DB: barbergest_db
    ports:
      - "5432:5432"
    volumes:
      - barbergest_data:/var/lib/postgresql/data
  
volumes:
  barbergest_data: