services:
  postgres:
    image: postgres:15-alpine
    container_name: barbergest
    restart: on-failure
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - barbergest_data:/var/lib/postgresql/data
  
volumes:
  barbergest_data: